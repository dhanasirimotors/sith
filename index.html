<html lang="en"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#17142e;--mute:#6f6a8d;--line:#ece9f7;--field:#f1effa;--acc:#5b3fd9;--cta:#ff6b4a;--ok:#2fb59a;--warn:#f5a524;--bad:#e5484d}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top small{opacity:.8}.top h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
.dn{display:flex;gap:6px}.dn button{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:1.1rem}

.seg{display:flex;gap:4px;background:var(--field);padding:4px;border-radius:14px;margin-bottom:12px;overflow-x:auto}

.it.done .g{opacity:.5;text-decoration:line-through}.g{flex:1;min-width:0;overflow-wrap:anywhere}.g small{display:block;color:var(--mute);font-size:.82rem}
.it input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 26px;width:26px;height:26px;padding:0;border-radius:50%;border:3px solid var(--mute);background:none}
.it input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 4px var(--field)}
.bare{background:none;padding:4px}.tm{text-align:center;min-width:48px}.tm b{display:block}.tm small{color:var(--mute)}
.x{border:0;background:none;color:var(--mute);padding:6px;font-size:1rem}
.emp{text-align:center;color:var(--mute);padding:14px}.emp{font-size:1.6rem}.emp p{font-size:.9rem;margin:4px 0 0}
details.add{margin-top:10px}details.add summary{cursor:pointer;font-weight:700;color:var(--acc);padding:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chip{border:0;border-radius:18px;padding:7px 12px;background:var(--field);font-weight:700;font-size:.84rem}.chip.on{background:var(--acc);color:#fff}
.bar{height:10px;border-radius:6px;background:var(--field);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc233,var(--cta))}
.big{font-size:2rem;font-weight:800;text-align:center}.mute{color:var(--mute);font-size:.88rem}.c{text-align:center}

.opt{display:block;width:100%;text-align:left;margin-top:6px}.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--bad);color:#fff}
.prose p{margin:8px 0}.note{background:var(--field);padding:10px;border-radius:12px;margin:10px 0}
.si{font-family:"Noto Sans Sinhala","Iskoola Pota","Nirmala UI",system-ui;line-height:1.9}
nav{position:fixed;left:0;right:0;margin:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:540px;display:flex;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:5px;box-shadow:0 8px 28px rgba(40,20,120,.22)}
nav button{flex:1;border:0;background:none;border-radius:16px;padding:7px 2px;font-size:.72rem;font-weight:700;color:var(--mute)}nav button span{display:block;font-size:1.3rem}nav button.on{background:var(--acc);color:#fff}
.hid{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
#lk{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}#lk input{max-width:200px;text-align:center;font-size:1.5rem;letter-spacing:.4em}
</style></head><body>
<div class="hero" id="hero"></div><input type="date" id="dp" class="hid" tabindex="-1" onchange="day=this.value||day;R()">

<div id="lk"><div style="font-size:2.2rem">🔒</div><b>My Planner</b><input id="lp" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off"><button class="btn go" onclick="unlock()">Unlock</button><div class="mute" id="lm"></div></div>
<script>

defaults();const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Phone storage is full.')}};

const A={Uni:'🎓',Tuition:'📖',Voxel:'💼',Voice:'🎙️',Reading:'📚',Learn:'🧠',Markets:'📈',Health:'💪',Personal:'🏡',Business:'🏢'},DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ORD=[1,2,3,4,5,6,0];

const mins=t=>{const p=t.split(':');return+p[0]*60+ +p[1]},byS=(a,b)=>a.start.localeCompare(b.start),dow=d=>new Date(d+'T00:00').getDay(),mm=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),

H0=()=>S.health[day]||{},setH=(k,v)=>{S.health[day]=Object.assign({},S.health[day],{[k]:v});save()},kc=d=>S.meals.filter(m=>m.date===d).reduce((s,m)=>s+m.kcal,0),

/* ===== UI kit ===== */

fld=(l,i)=>`<label class="f"><span>${l}</span>${i}</label>`,inp=(id,ph,t='text',v='')=>`<input id="${id}" type="${t}" placeholder="${ph}" value="${esc(v)}">`,

function hero(){const d=new Date(day+'T00:00'),h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening',nav=(T==='today'||T==='health')?`<div class="dn"><button onclick="shift(-1)" aria-label="Previous day">‹</button><button onclick="$('#dp').showPicker?$('#dp').showPicker():$('#dp').click()" aria-label="Pick date">📅</button><button onclick="shift(1)" aria-label="Next day">›</button></div>`:'';
 let r='';if(T==='today'){const bl=S.blocks.filter(b=>b.date===day),w=S.goals.water;r=`<div class="rings">${ring((H0().water||0)/w,'#5ce1e6',(H0().water||0)+'/'+w,'Water')}${ring(kc(day)/S.goals.kcal,'#ffc233',kc(day),'kcal')}${ring(bl.length?bl.filter(b=>b.done).length/bl.length:0,'#ff8a6b',bl.filter(b=>b.done).length+'/'+bl.length,'Blocks')}</div>`}

/* ===== TODAY ===== */

/* ===== PLAN ===== */
const taskRow=t=>it({c:t.pri+(t.done?' done':''),l:chk(t.done,`tg('tasks','${t.id}')`),t:(A[t.a]||'')+' '+esc(t.title),s:`${t.a} · ${t.pri}${t.due?' · due '+t.due:''}`,r:x(`rm('tasks','${t.id}')`)}),

function addTask(){const t=val('tt');if(!t){alert('Enter a task.');return}S.tasks.push({id:uid(),title:t,pri:$('#tp').value,a:$('#ta').value,due:val('td'),done:false});save();R()}
PL.classes=()=>{const days=ORD.filter(d=>S.classes.some(c=>c.dow===d)),cur=days.includes(cd)?cd:(days.includes(new Date().getDay())?new Date().getDay():days[0]),L=S.classes.filter(c=>c.dow===cur).sort(byS),m=iso(new Date()).slice(0,7),
