<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b34c4">
<title>My Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f3f0fb;--card:#fff;--ink:#1f1a3d;--mute:#7a7396;--field:#f1eefa;--acc:#ff6b4a;--on:#fff;--sh:0 8px 22px rgba(70,45,160,.10);--line:#e6e0f6;--hi:#e5484d;--med:#f5a524;--low:#2fb5a0}
@media(prefers-color-scheme:dark){:root{--bg:#120f26;--card:#1d1938;--ink:#efecff;--mute:#9b94be;--field:#2a2550;--sh:0 8px 22px rgba(0,0,0,.35);--line:#2f2a55}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:var(--ink)}
.hero{background:linear-gradient(140deg,#2a2168 0%,#5a3fd1 60%,#8b5cf6 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 26px;border-radius:0 0 30px 30px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sub{font-size:.9rem;opacity:.8}
h1{margin:2px 0 0;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.dn{display:flex;gap:6px}
.dn button{width:42px;height:42px;border:0;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font-size:1.2rem}
.rings{display:flex;justify-content:space-around;margin-top:18px}
.ring{text-align:center;width:30%}
.ring svg{width:74px;height:74px;display:block;margin:0 auto 4px}
.ring b{display:block;font-size:1.05rem}
.ring span{font-size:.78rem;opacity:.8}
main{padding:16px 14px 120px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
h2{margin:0 0 12px;font-size:1.08rem;font-weight:800}
input,select{width:100%;background:var(--field);border:2px solid transparent;border-radius:14px;padding:13px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:10px;margin-bottom:10px}.row>*{flex:1;min-width:0}
.row>button{flex:0 0 auto}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 5px;font-weight:600}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--field);cursor:pointer}
.go{background:var(--acc);color:#fff;box-shadow:0 6px 14px rgba(255,107,74,.35)}
.item{display:flex;gap:12px;align-items:center;padding:12px;margin-top:8px;background:var(--field);border-radius:16px;border-left:6px solid var(--mute)}
.item.High{border-left-color:var(--hi)}.item.Medium{border-left-color:var(--med)}.item.Low{border-left-color:var(--low)}
.item.blk{border-left-color:#8b5cf6}.item.meal{border-left-color:var(--acc)}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.when{font-weight:800;font-size:.92rem;color:#7c5ce6}
@media(prefers-color-scheme:dark){.when{color:#b9a5ff}}
.item.done .grow{opacity:.5;text-decoration:line-through}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 28px;width:28px;height:28px;border-radius:50%;border:3px solid var(--mute);background:transparent;padding:0}
.item input[type=checkbox]:checked{background:var(--low);border-color:var(--low);box-shadow:inset 0 0 0 5px var(--field)}
.x{border:0;background:none;color:var(--mute);font-size:1.1rem;padding:8px}
.mute{color:var(--mute);font-size:.88rem}
.empty{text-align:center;color:var(--mute);padding:18px 8px 8px}
.empty b{display:block;font-size:1.8rem}
.drops{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.drop{border:0;background:none;font-size:1.9rem;padding:4px;opacity:.22;filter:grayscale(.3)}
.drop.on{opacity:1}
.bar{height:12px;border-radius:8px;background:var(--field);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ffc233,var(--acc))}
.big{font-size:2.2rem;font-weight:800;text-align:center}
.bk{display:flex;gap:8px;justify-content:space-between;align-items:center}
nav{position:fixed;left:0;right:0;margin:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:520px;display:flex;gap:4px;background:var(--card);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(40,20,120,.28)}
nav button{flex:1;border:0;background:none;border-radius:18px;padding:8px 2px;font-size:.78rem;font-weight:700;color:var(--mute)}
nav button span{display:block;font-size:1.35rem;line-height:1.2}
nav button.on{background:var(--acc);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chip{border:0;border-radius:20px;padding:8px 12px;background:var(--field);font-weight:700;font-size:.85rem}.chip.on{background:var(--acc);color:#fff}
.ttg{display:grid;gap:2px 0}
.dh{text-align:center;font-weight:800;font-size:.78rem;padding:6px 0;border-radius:10px;color:var(--mute)}
.dh.today{background:var(--acc);color:#fff}
.gut{position:relative}
.gut span{position:absolute;right:4px;color:var(--mute);font-size:.62rem}
.dc{position:relative;border-left:1px solid var(--line)}
.tb{position:absolute;border:0;border-radius:8px;padding:3px 1px;overflow:hidden;text-align:center;background:hsl(var(--h),75%,87%);color:hsl(var(--h),60%,22%);line-height:1.15;display:flex;flex-direction:column;align-items:center}
.tb b{font-size:.8rem}.tb span{font-size:.62rem;font-weight:700}
.tb.sel{outline:3px solid var(--ink);z-index:2}
@media(prefers-color-scheme:dark){.tb{background:hsl(var(--h),38%,30%);color:hsl(var(--h),85%,90%)}}
.cls{display:flex;gap:12px;align-items:center;background:var(--field);border-radius:16px;padding:12px;margin-top:8px;border-left:6px solid hsl(var(--h),65%,55%)}
.ct{text-align:center;min-width:56px}.ct b{display:block;font-size:1.1rem}.ct span{font-size:.82rem;color:var(--mute)}
.cb{flex:1;min-width:0}.cb b{overflow-wrap:anywhere}
.par{font-size:.76rem;font-weight:700;color:var(--med);margin-top:2px}
.hid{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
button:focus-visible{outline:3px solid #8b5cf6;outline-offset:2px}
</style></head><body>
<div class="hero" id="hero"></div>
<input type="date" id="day" class="hid" tabindex="-1" onchange="day=this.value||day;render()">
<main id="main"></main>
<nav>
<button data-t="today" onclick="go('today')"><span>🗓️</span>Today</button>
<button data-t="tasks" onclick="go('tasks')"><span>✅</span>Tasks</button>
<button data-t="health" onclick="go('health')"><span>💪</span>Health</button>
<button data-t="diet" onclick="go('diet')"><span>🍽️</span>Diet</button>
<button data-t="uni" onclick="go('uni')"><span>📚</span>Schedule</button>
<button data-t="more" onclick="go('more')"><span>🧭</span>More</button>
</nav>
<script>
const $=s=>document.querySelector(s),K='planner_v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{tasks:[],blocks:[],health:{},meals:[],goals:{water:8,kcal:2000},classes:[],deadlines:[]};
S.classes=S.classes||[];S.deadlines=(S.deadlines||[]).filter(d=>d.course!=='Level 2 · Semester II');
if(!S.mig1){S.classes=S.classes.filter(c=>!/QS2180|QS2170/.test(c.course));S.mig1=true;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const iso=d=>d.toLocaleDateString('en-CA');
let tab='today',day=iso(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=d=>S.health[d]||{water:0,sleep:'',ex:''};
const kcalOf=d=>S.meals.filter(m=>m.date===d).reduce((s,m)=>s+m.kcal,0);
const go=t=>{tab=t;render();scrollTo(0,0)};
function shift(n){const d=new Date(day+'T00:00');d.setDate(d.getDate()+n);day=iso(d);render()}
function pick(){const e=$('#day');e.showPicker?e.showPicker():e.click()}
function tog(l,id){const i=S[l].find(x=>x.id===id);i.done=!i.done;save();render()}
function del(l,id){S[l]=S[l].filter(x=>x.id!==id);save();render()}
const val=id=>$('#'+id).value.trim();
const empty=(i,t)=>`<div class="empty"><b>${i}</b>${t}</div>`;

const ring=(p,c,big,small)=>`<div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(Math.min(1,p||0)*163.4).toFixed(1)} 163.4" transform="rotate(-90 32 32)"/></svg><b>${big}</b><span>${small}</span></div>`;
function hero(){
 const d=new Date(day+'T00:00'),now=new Date(),h=now.getHours(),isNow=iso(now)===day;
 const hi=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 const title=tab==='today'?(isNow?hi:'Plan ahead'):{tasks:'Tasks',health:'Health',diet:'Diet',uni:'Schedule',more:'More'}[tab];
 const date=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
 let r='';
 if(tab==='today'){const bl=S.blocks.filter(b=>b.date===day),hh=H(day),kc=kcalOf(day);
  r=`<div class="rings">${ring(hh.water/S.goals.water,'#5ce1e6',hh.water+'/'+S.goals.water,'Water')}${ring(kc/S.goals.kcal,'#ffc233',kc,'kcal')}${ring(bl.length?bl.filter(b=>b.done).length/bl.length:0,'#ff8a6b',bl.filter(b=>b.done).length+'/'+bl.length,'Blocks')}</div>`}
 const nav=(tab==='tasks'||tab==='uni')?'':`<div class="dn"><button onclick="shift(-1)" aria-label="Previous day">‹</button><button onclick="pick()" aria-label="Pick a date">📅</button><button onclick="shift(1)" aria-label="Next day">›</button></div>`;
 return `<div class="top"><div><div class="sub">${tab==='tasks'?'All your to-dos':tab==='uni'?'Timetable and deadlines':date}</div><h1>${title}</h1></div>${nav}</div>${r}`}

const taskRow=t=>`<div class="item ${t.pri} ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tog('tasks','${t.id}')" aria-label="Mark done"><div class="grow"><b>${ai(t.a)}${esc(t.title)}</b><div class="mute">${t.a?t.a+' · ':''}${t.pri} priority${t.due?' · due '+esc(t.due):''}</div></div><button class="x" onclick="del('tasks','${t.id}')" aria-label="Delete">✕</button></div>`;

function vToday(){
 const bl=S.blocks.filter(b=>b.date===day).sort((a,b)=>a.start.localeCompare(b.start));
 const due=S.tasks.filter(t=>!t.done&&t.due===day);
 return bkBanner()+uniToday()+fbCard()+`<div class="card"><h2>⏱️ Plan a time block</h2>
 <div class="row"><div><label style="margin-top:0">From</label><input type="time" id="bs"></div><div><label style="margin-top:0">To</label><input type="time" id="be"></div></div>
 <div class="row"><input id="bt" placeholder="What will you work on?"></div>
 <div class="row">${aopt('ba')}</div>
 <div class="row"><button class="btn go" onclick="addBlock()">Add to my day</button></div></div>
 <div class="card"><h2>Your day</h2>${bl.map(b=>`<div class="item blk ${b.done?'done':''}"><input type="checkbox" ${b.done?'checked':''} onchange="tog('blocks','${b.id}')" aria-label="Mark done"><div class="grow"><div class="when">${esc(b.start)} – ${esc(b.end)}</div>${ai(b.a)}${esc(b.title)}</div><button class="x" onclick="del('blocks','${b.id}')" aria-label="Delete">✕</button></div>`).join('')||empty('🌤️','Nothing planned yet.<br>Add your first block above.')}</div>
 ${due.length?`<div class="card"><h2>📌 Due today</h2>${due.map(taskRow).join('')}</div>`:''}
 <div class="card"><h2>💾 Backup and reminders</h2><p class="mute" style="margin:0 0 10px">Your data is stored on this phone only. Save a backup file every week.</p><div class="row"><button class="btn" onclick="exp()">Save backup</button><button class="btn" onclick="$('#imp').click()">Restore</button></div><div class="row"><button class="btn go" onclick="cal()">🔔 Add reminders to phone calendar</button></div><input type="file" id="imp" accept=".json,application/json" class="hid" onchange="imp(event)"></div>`}
function addBlock(){const s=val('bs'),t=val('bt');if(!s||!t){alert('Please enter a start time and a title.');return}
 S.blocks.push({id:uid(),date:day,start:s,end:val('be')||s,title:t,a:$('#ba').value,done:false});save();render()}
function exp(){if(nbk())return;S.lastBackup=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='planner-backup.json';a.click()}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tasks||!d.blocks)throw 0;S=d;S.classes=S.classes||[];S.deadlines=S.deadlines||[];save();render()}catch(x){alert('That file is not a planner backup.')}};r.readAsText(f)}

function vTasks(){
 const o={High:0,Medium:1,Low:2},cmp=(a,b)=>o[a.pri]-o[b.pri]||(a.due||'9').localeCompare(b.due||'9');
 const open=S.tasks.filter(t=>!t.done&&(fa==='All'||t.a===fa)).sort(cmp),dn=S.tasks.filter(t=>t.done);
 return `<div class="card"><h2>✨ New task</h2><div class="row"><input id="tt" placeholder="What needs doing?"></div>
 <div class="row"><div><label style="margin-top:0">Priority</label><select id="tp"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div><label style="margin-top:0">Due date</label><input type="date" id="td"></div></div>
 <div class="row"><div><label style="margin-top:0">Area</label>${aopt('ta')}</div></div>
 <div class="row"><button class="btn go" onclick="addTask()">Add task</button></div></div>
 <div class="card"><h2>To do (${open.length})</h2><div class="chips">${['All',...Object.keys(AREAS)].map(k=>`<button class="chip ${k===fa?'on':''}" onclick="fa='${k}';render()">${k==='All'?'':AREAS[k]+' '}${k}</button>`).join('')}</div>${open.map(taskRow).join('')||empty('🎉','All clear. Enjoy the free time!')}</div>
 ${dn.length?`<div class="card"><h2>Completed (${dn.length})</h2>${dn.map(taskRow).join('')}<div class="row" style="margin:12px 0 0"><button class="btn" onclick="clearDone()">Clear completed</button></div></div>`:''}`}
function addTask(){const t=val('tt');if(!t){alert('Please enter a task title.');return}
 S.tasks.push({id:uid(),title:t,pri:$('#tp').value,a:$('#ta').value,due:val('td'),done:false});save();render()}
function clearDone(){S.tasks=S.tasks.filter(t=>!t.done);save();render()}

function vHealth(){const h=H(day),n=Math.max(S.goals.water,h.water);
 return healthExtra()+`<div class="card"><h2>💧 Water</h2><div class="drops">${Array.from({length:n},(_,i)=>`<button class="drop ${i<h.water?'on':''}" onclick="setW(${i+1===h.water?i:i+1})" aria-label="${i+1} glasses">💧</button>`).join('')}</div>
 <div class="big">${h.water} <span class="mute" style="font-size:1rem;font-weight:600">of ${S.goals.water} glasses</span></div>
 <label>Daily goal (glasses)</label><input type="number" inputmode="numeric" min="1" value="${S.goals.water}" onchange="goal('water',this.value)"></div>
 <div class="card"><h2>😴 Sleep</h2><label style="margin-top:0">Hours slept last night</label><input type="number" inputmode="decimal" step="0.5" min="0" max="24" value="${esc(h.sleep)}" placeholder="e.g. 7.5" onchange="setH('sleep',this.value)"></div>
 <div class="card"><h2>🏃 Exercise</h2><label style="margin-top:0">Minutes today</label><input type="number" inputmode="numeric" min="0" value="${esc(h.ex)}" placeholder="e.g. 30" onchange="setH('ex',this.value)"></div>`}
function setH(k,v){S.health[day]=Object.assign({},H(day),{[k]:v});save()}
function setW(n){S.health[day]=Object.assign({},H(day),{water:n});save();render()}
function goal(k,v){const n=parseInt(v);if(n>0){S.goals[k]=n;save();render()}}

const ico={Breakfast:'🍳',Lunch:'🍛',Dinner:'🍽️',Snack:'🍎'};
function vDiet(){const ms=S.meals.filter(m=>m.date===day),t=kcalOf(day),left=S.goals.kcal-t;
 return `<div class="card"><h2>🔥 Calories</h2><div class="bk"><div class="big">${t}</div><div class="mute" style="text-align:right">of ${S.goals.kcal} kcal<br><b style="color:var(--ink)">${left>=0?left+' left':(-left)+' over'}</b></div></div><div class="bar"><i style="width:${Math.min(100,t/S.goals.kcal*100)}%"></i></div></div>
 <div class="card"><h2>🍴 Log a meal</h2><div class="row"><select id="mt"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select><input type="number" inputmode="numeric" id="mk" min="0" placeholder="kcal"></div>
 <div class="row"><input id="mn" placeholder="What did you eat?"></div><div class="row"><button class="btn go" onclick="addMeal()">Add meal</button></div>
 ${ms.map(m=>`<div class="item meal"><div style="font-size:1.6rem">${ico[m.type]||'🍽️'}</div><div class="grow"><b>${esc(m.name)}</b><div class="mute">${m.type} · ${m.kcal} kcal</div></div><button class="x" onclick="del('meals','${m.id}')" aria-label="Delete">✕</button></div>`).join('')||empty('🥗','No meals logged for this day.')}</div>
 <div class="card"><h2>🎯 Daily calorie goal</h2><input type="number" inputmode="numeric" min="500" value="${S.goals.kcal}" onchange="goal('kcal',this.value)"></div>`}
function addMeal(){const n=val('mn');if(!n){alert('Please enter what you ate.');return}
 S.meals.push({id:uid(),date:day,type:$('#mt').value,name:n,kcal:parseInt(val('mk'))||0});save();render()}

const AREAS={Uni:'🎓',Tuition:'📖',Voxel:'💼',Reading:'📚',Learn:'🧠',Markets:'📈',Health:'💪',Personal:'🏡',Business:'🏢'},ai=a=>AREAS[a]?AREAS[a]+' ':'',aopt=(id,sel)=>`<select id="${id}">${Object.keys(AREAS).map(k=>`<option ${k===sel?'selected':''}>${k}</option>`).join('')}</select>`;
let fa='All';
function bkBanner(){const n=S.tasks.length+S.blocks.length+S.meals.length+S.classes.length+S.deadlines.length;
 if(!n||(S.lastBackup&&Date.now()-S.lastBackup<6048e5))return'';
 return `<div class="card"><h2>💾 Time for your weekly backup</h2><p class="mute" style="margin:0 0 10px">${S.lastBackup?'Your last backup was '+Math.floor((Date.now()-S.lastBackup)/864e5)+' days ago.':'You have not saved a backup yet.'}</p><div class="row"><button class="btn go" onclick="exp()">Save backup now</button></div></div>`}
function cal(){
 const E=s=>String(s).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 const T=d=>d.replace(/-/g,''),Hm=t=>t.replace(':','')+'00',L=[],st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 const ev=(id,sum,a,b,rr,al,desc)=>L.push('BEGIN:VEVENT','UID:'+id+'@planner','DTSTAMP:'+st,'DTSTART:'+a,b&&b>a?'DTEND:'+b:'DURATION:PT30M',...(rr?['RRULE:'+rr]:[]),'SUMMARY:'+E(sum),...(desc?['DESCRIPTION:'+E(desc)]:[]),...al.flatMap(x=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+E(sum),'TRIGGER:'+x,'END:VALARM']),'END:VEVENT');
 const today=iso(new Date()),nx=w=>{const d=new Date();while(d.getDay()!==w)d.setDate(d.getDate()+1);return T(iso(d))},BD=['SU','MO','TU','WE','TH','FR','SA'];
 S.classes.forEach(c=>ev(c.id,(c.a?c.a+': ':'')+c.course+(c.venue?' ('+c.venue+')':''),nx(c.dow)+'T'+Hm(c.start),nx(c.dow)+'T'+Hm(c.end),'FREQ=WEEKLY;BYDAY='+BD[c.dow]+(c.until?';UNTIL='+T(c.until)+'T235959':''),['-PT15M']));
 S.deadlines.filter(x=>!x.done).forEach(x=>ev(x.id,'DEADLINE: '+x.title+(x.course?' ('+x.course+')':''),T(x.due)+'T'+Hm(x.time||'09:00'),0,0,['-P1D','-PT2H']));
 S.tasks.filter(t=>!t.done&&t.due).forEach(t=>ev(t.id,'Task: '+t.title,T(t.due)+'T'+Hm('09:00'),0,0,['PT0S']));
 S.blocks.filter(b=>!b.done&&b.date>=today).forEach(b=>ev(b.id,(b.a?b.a+': ':'')+b.title,T(b.date)+'T'+Hm(b.start),T(b.date)+'T'+Hm(b.end),0,['-PT10M']));
 ev('weekly-backup','Back up my Planner and refresh reminders',nx(0)+'T200000',0,'FREQ=WEEKLY;BYDAY=SU',['PT0S'],'Open Planner, Today tab: Save backup, then Add reminders to phone calendar.');
 const dayItems=ds=>{const w=new Date(ds+'T00:00').getDay();return{cl:S.classes.filter(c=>c.dow===w&&(!c.until||ds<=c.until)).sort(byStart),bl:S.blocks.filter(b=>b.date===ds&&!b.done).sort(byStart),tk:S.tasks.filter(t=>!t.done&&t.due===ds),dl:S.deadlines.filter(x=>!x.done&&x.due===ds)}};

{id:'qs2100',title:'QS2100 Building Information Modelling',icon:'🏗️',lessons:[{t:'BIM Basics',b:'BIM කියන්නේ building එකක 3D model එකක් එක්ක ඒකේ information (material, cost, time) එකතු කරන ක්‍රමය.\n4D BIM = 3D + Time. 5D BIM = 3D + Time + Cost.\nModel එකෙන් quantities ගන්න පුළුවන් (quantity take-off) — QS කෙනෙකුට ලොකු ප්‍රයෝජනයක්.\nClash detection: services සහ structure එකිනෙක ගැටෙනවාද කියලා site එකට යන්න කලින් හොයාගන්න පුළුවන්.\nIFC කියන්නේ software අතර model share කරන open format එක.',q:[{q:'Clash detection වලින් හොයන්නේ?',o:['Elements අතර ගැටීම්','Price වෙනස','Colour'],a:0}]}]},

{id:'qs2120',title:'QS2120 Construction Costing',icon:'💰',lessons:[{t:'Unit Rate Build-up',b:'Direct cost = Materials + Labour + Plant.\nඒකට Overheads (site සහ head office) සහ Profit එකතු කරලා final rate එක හැදෙනවා.\nUnit rate එකක් හදනකොට: quantity එකකට material, wastage %, labour hours, plant hours ගණන් කරන්න.\nඉහළ rate එකෙන් bid එක නැතිවෙන්න පුළුවන්; පහළ rate එකෙන් පාඩුවක් වෙන්න පුළුවන්.'}]},

{id:'mgt',title:'Time and Self Management',icon:'⏱️',lessons:[{t:'Eisenhower and Pareto',b:'Eisenhower Matrix: Urgent + Important → දැන්ම කරන්න; Important පමණක් → schedule කරන්න; Urgent පමණක් → delegate කරන්න; දෙකම නැත්නම් අයින් කරන්න.\nPareto 80/20: ප්‍රතිඵලවලින් 80%ක් එන්නේ උත්සාහයෙන් 20%කින්.\nසතිපතා Sunday review: ඉවර කළ දේ බලන්න, ඊළඟ සතියේ top 3 goals තෝරන්න.\nVoxel වැඩවලින් delegate කළ හැකි ඒවා හඳුනාගන්න.'}]});

{t:'3. Pace, Pause, Pitch, Emphasis',b:'Pace: පැහැදිලි narration/news සඳහා විනාඩියකට වචන 140-160 පමණ; hype ads වේගවත්, emotional ads මන්දගාමී.\nPause: කොමා/තිත ළඟ කෙටි නැවතුමක්; වැදගත් වචනයකට කලින් pause එකකින් අවධානය ගන්න.\nPitch: statement එකක අවසානයේ පහළට; ප්‍රශ්නයක අවසානයේ ඉහළට.\nEmphasis: වාක්‍යයේ ප්‍රධාන වචනයක් එකක් දෙකක් තද කරන්න. හැම වචනයකටම තද කළොත් කිසිවක් තද නැහැ.\nScript marking: / = කෙටි pause, // = දිග pause, underline = emphasis, ↑ ↓ = pitch.',p:'Paragraph එකක් mark කරලා record කරන්න. Marking නැතිව එකත් record කරලා සසඳන්න.',q:[{q:'වාක්‍යයක emphasis දිය යුත්තේ?',o:['ප්‍රධාන වචන එකක් දෙකකට','හැම වචනයකටම','කිසිවකට නෙවෙයි'],a:0}]},
{t:'4. Event, Radio and MC',b:'Event MC: Introduce → Build energy → Hand over. Programme flow, timing සහ නම්වල නිවැරදි උච්චාරණය (කලින් අසාගන්න) වැදගත්.\nRadio: mic එකෙන් අඟල් 4-6 (සෙ.මී. 10-15) දුරින්, plosives (p, b) අඩු කරන්න, එක කෙනෙකුට කතා කරන විදියට කතා කරන්න.\nහොඳ intro: Who, What, When, Where — තත්පර 10ක් ඇතුළත.\nDead air (නිහඬතාව) වළක්වන්න: backup lines 3ක් සූදානම් කරගන්න.\nසජීවීව වැරදීමක් වුණොත් නතර වෙලා ආයෙ කියන්න එපා; ස්වභාවිකව ඉදිරියට යන්න. Event එකට කලින් sound check කරන්න.',p:'තත්පර 30ක Event intro එකක් (who/what/when/where) ලියලා record කරන්න.',q:[{q:'හොඳ intro එකක තියෙන්න ඕන?',o:['Who, What, When, Where','Price පමණයි','Joke එකක් පමණයි'],a:0}]},
{t:'5. Acting for Voice and Weekly Plan',b:'Voice acting: Objective (චරිතයට ඕන දේ), Obstacle (බාධාව), Emotion, Subtext (කියන දේට වඩා අදහස).\nපේළියක් සතුට, කෝපය, දුක යන emotions තුනෙන් record කරලා වෙනස ඇහෙනවාදැයි බලන්න.\nPresenting: script එකට නොව, අහන්නාට කතා කරන්න.\nසතියක පුහුණුව: Mon/Wed/Fri — breathing + diction (20 min); Tue/Thu — script reading + record (20 min); Sat — acting + review (30 min); Sun — විවේකය.',p:'ඔයාගේ record එකක් අහලා ශක්තිමත් දෙයක් 1ක් සහ වැඩිදියුණු කළ යුතු දෙයක් 1ක් ලියන්න.',q:[{q:'Subtext යනු?',o:['කියන දේට වඩා ඇති අදහස','Script එකේ අවසානය','Mic එකක වර්ගයක්'],a:0}]}]},

{t:'1. Dubbing Pipeline',b:'Dubbing යනු මුල් වීඩියෝවේ කථාව වෙනත් භාෂාවකින් නැවත record කිරීමයි.\nපියවර: Script translation/adaptation → Casting → Recording (studio) → Mixing → QC.\nAdaptation: වචනයෙන් වචනයට නොව, අරුතට සහ timing එකට ගැලපෙන ලෙස හැඩගැස්වීම.\nCue: කතා පටන් ගන්න සහ නතර කරන තැන් script එකේ ලකුණු කරන්න (timecode).\nStudio එකේදී Director ගේ notes අනුව takes කිහිපයක් දෙන්න.',p:'තත්පර 20ක ඉංග්‍රීසි clip එකක් සිංහලට adapt කරලා timing එකට ගැලපෙනවාදැයි බලන්න.',q:[{q:'Adaptation යනු?',o:['අරුතට සහ timing එකට ගැලපෙන ලෙස හැඩගැස්වීම','වචනයෙන් වචනයට පරිවර්තනය','වීඩියෝ edit කිරීම'],a:0}]},
{t:'2. Lip Sync and Timing',b:'Lip sync යනු මුඛ චලනයට ගැලපීමයි. වචන ගණනට වඩා syllables සහ කට open/close වෙන තැන් වැදගත්.\nම, ප, බ වැනි ශබ්ද වලදී තොල් වැසෙනවා; ඒවා ගැලපිය යුතුයි.\nOff-screen හෝ narration වලදී lip sync අවශ්‍ය නැහැ, timing පමණක් බලන්න.\nදිග ගැලපෙන්න කෙටි වාක්‍ය හෝ filler වචන යොදාගන්න.\nප්‍රායෝගිකව: scene එක 3 වතාවක් බලන්න; headphones දාගෙන record කරන්න; ඔබේ take එක video එක සමඟ play කරලා බලන්න.',p:'තත්පර 15ක clip එකකට dub කරලා video එකත් එක්ක play කරලා ගැලපෙනවාදැයි බලන්න.',q:[{q:'ම, ප, බ වැනි ශබ්ද වලදී?',o:['තොල් වැසෙනවා','කට ලොකුවෙන් විවෘත වෙනවා','දිව එළියට එනවා'],a:0}]},
{t:'3. Emotion and Character Voices',b:'මුල් නළුවාගේ energy (volume, pitch, pace) අහලා ගැලපෙන්න.\nකෑගැසීම්, whisper, හිනාව, අඳෝනාව: breath support එකෙන් කරන්න, උගුරෙන් නෙවෙයි. දිගුකාලීන කෑගැසීමෙන් voice එක හානි වෙනවා.\nCharacter voice: pitch, pace සහ accent තුනෙන් character එකක් හදන්න.\nConsistency: take එකෙන් take එකට, episode එකෙන් episode එකට එකම character voice එක තියාගන්න.',p:'එකම පේළිය සතුට, බිය, කෝපය යන emotions තුනෙන් record කරන්න.',q:[{q:'Character voice එකක consistency යනු?',o:['Take එකෙන් take එකට එකම voice එක','හැම take එකක්ම වෙනස් කිරීම','වඩා හයියෙන් කතා කිරීම'],a:0}]},
{t:'4. Demo Reel and Getting Work',b:'Demo reel: තත්පර 60-90, හොඳම clip එක මුලින්ම. Styles: commercial, narration, character, drama.\nRecording quality: නිහඬ කාමරය (රෙදි/mattress වලින් echo අඩු කරන්න), pop filter, WAV 44.1/48 kHz, peaks −6 dB පමණ (clip නොවන ලෙස).\nWork සොයන තැන්: studios, radio stations, ad agencies, YouTube/animation creators. Voxel හරහා ඔබේ clients ගේ වීඩියෝ වලට voiceover කරන්නත් පුළුවන්.\nමුල් gigs වලින් testimonial සහ credits ගන්න; rate card එකක් හදාගන්න (per minute / per project).\nසතියට outreach 5ක් යවලා, යැවූ ඒවා track කරන්න.',p:'Demo reel එකට clips 4ක් තෝරලා පිළිවෙල හදන්න.',q:[{q:'Demo reel එකේ හොඳම clip එක දාන්න ඕන?',o:['මුලින්ම','අන්තිමට','මැදට'],a:0}]}]});
